[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "falsifyai"
version = "0.0.1"
description = "Adversarial scientific AI that looks for experiments capable of falsifying a hypothesis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2",
    "python-dotenv>=1",
    "uvicorn>=0.32",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
